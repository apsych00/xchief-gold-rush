# The whole box: Postgres, the game server, and Caddy (docs/box-spec.md 1.7).
#
#   cp .env.box.example .env.box   # fill it in first (see docs/box-deploy.md)
#   docker compose --env-file .env.box up -d --build
#
# Only Caddy publishes ports. The database is reachable from the compose
# network as db:5432 and from nowhere else; ops scripts run inside the server
# container with `docker compose exec server ...`.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing - cp .env.box.example .env and fill it in}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    # Everything the game server reads (DATABASE_URL, FINNHUB_TOKEN,
    # PLAYER_TOKEN_SECRET, ELASTIC_API_KEY, OTP_SENDER, PORT) comes from .env.
    env_file: .env.box
    # On start the image applies db/schema.sql + db/seed.sql (idempotent) and
    # then runs server/index.js (ticket 3), which listens on PORT (8787).
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      # Bcrypt hash for the /logs (Dozzle) basic-auth password. Generate with:
      #   docker run --rm caddy:2 caddy hash-password --plaintext '<pw>'
      DOZZLE_PASSWORD_HASH: ${DOZZLE_PASSWORD_HASH:?DOZZLE_PASSWORD_HASH is missing - see .env.box.example}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The built frontend (npm run build). The mount is live: a new dist/ is
      # served immediately, no container restart needed.
      - ./dist:/srv/app:ro
      # The static operator page (ticket D1, ops/index.html). Also live-mounted.
      - ./ops:/srv/ops:ro
      # The ad banner list (ticket B11, ads/banners.json) and its images. Also live-mounted
      # so it can be edited without a rebuild; the Caddyfile's handle_path /ads* claims the
      # whole path ahead of the SPA handle, so the images must live here too (duplicated from
      # public/ads/, which only exists for the dev server and dist/ parity) or they 404.
      - ./ads:/srv/ads:ro
      - caddy_data:/data
      - caddy_config:/config

  # Optional second price source: an MT5 terminal under Wine + a tick bridge
  # (mt5/, docs/mt5-feed.md "Bridge route"), an alternative to the MetaApi
  # source. Off by default - only builds/starts with
  # `docker compose --profile mt5 up`. Port 8765 (ticks) stays inside the
  # compose network, the server reaches it as mt5:8765
  # (MT5_BRIDGE_WS=ws://mt5:8765 in .env.box). The only published port is
  # KasmVNC's HTTPS UI (3001), bound to loopback only, for the one-time first
  # login (docs/mt5-feed.md "Bridge route" -> "First login").
  mt5:
    build:
      context: .
      dockerfile: mt5/Dockerfile
    restart: unless-stopped
    profiles: ['mt5']
    env_file: .env.box
    # /config is the Wine prefix (docs/reports/b15-harden.md): the MT5 terminal's
    # login/license state, the installed Wine-side Python + MetaTrader5/websockets
    # packages, and the entrypoint's install marker all live here. Without this
    # volume every recreate (image rebuild, host reboot) throws all of it away and
    # replays the first-login dialog.
    volumes:
      - mt5_data:/config
    ports:
      - '127.0.0.1:3001:3001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8766/healthz']
      interval: 15s
      timeout: 5s
      retries: 4
      # Generous: a cold first boot downloads Mono + the MT5 installer + a Python
      # installer (docs/mt5-feed.md) before bridge.py's healthz port even opens.
      start_period: 900s
    # Sized from a measured idle run of this image on this box
    # (docs/reports/b15-harden.md "Memory and CPU limits"): the KasmVNC desktop
    # stack (Xvfb, openbox, nginx) plus Wine + the MT5 terminal plus bridge.py.
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # Live container logs in a browser for the operator (docs/layers.md D1). Not published
  # directly: Caddy proxies it at /logs behind basic_auth. Production alternative:
  # Cloudflare Access in front of /logs instead of (or in addition to) the Caddy password
  # (docs/box-deploy.md).
  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    environment:
      DOZZLE_BASE: /logs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  mt5_data:
